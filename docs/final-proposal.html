<figure>
    <img src="projects/aura-thinker/slide.png" alt="Proposal slide titled Aura Thinker. The Aura Thinker is a 3D-printed meme oracle that helps stressed students take a ten-second break and laugh at themselves. It reads your aura from how warm, steady, and close your hands are while you hold its crystal orb, and responds by glowing the orb in your aura color, chiming, and showing your fortune. Bill of materials: inputs are an ultrasonic sensor, a GY-521 accelerometer, and a thermistor. Outputs are an RGB LED, an LCD1602, and a passive buzzer. Also an Elegoo UNO R3, resistors, a potentiometer, and jumper wires. 3D printed: Pepe the Thinker by Gabe Talbott under CC BY-SA, a base, and a clear PETG orb. Timeline: week 1, test sensors and start printing. Week 2, breadboard circuit and aura logic. Week 3, print and fit the enclosure. Week 4, assemble, tune, and playtest. Plan B: if the thermistor is too slow, use DHT11 breath sensing. If the accelerometer is too noisy, use ultrasonic jitter for steadiness. If the orb tether is unreliable, fix the orb in a cradle. On the right is a labeled render of the Pepe the Thinker model on a dashed outline of the base, with a dashed orb in front. The orb holds the RGB LED, GY-521, and thermistor. The base holds the LCD1602, buzzer, ultrasonic sensor, and the UNO." width="960" height="540" />
