<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title description">
<title id="title">UNO R3 with independently controlled red, green and blue LEDs</title>
<desc id="description">D7 connects to red, D6 to green and D5 to blue, each through a separate 330 ohm resistor. All LED cathodes connect to UNO ground. Power the UNO through USB.</desc>
<rect width="1000" height="650" fill="white"/>
<style>text{font-family:Arial,sans-serif;fill:#14213d}.wire{fill:none;stroke:#14213d;stroke-width:3}.label{font-size:19px}.small{font-size:16px}</style>
<text x="50" y="55" font-size="29" font-weight="bold">Three independent holiday lights</text>
<text x="50" y="85" class="label">ELEGOO UNO R3 · USB power · one resistor per LED</text>
<rect x="50" y="130" width="220" height="410" rx="10" fill="#edf4f8" stroke="#14213d" stroke-width="3"/>
<text x="75" y="365" font-size="24" font-weight="bold">UNO R3</text>
<text x="75" y="397" class="small">USB → 5 V supply</text>
<text x="217" y="168" class="label">D7</text>
<path class="wire" d="M270 180 H340 m80 0 H520 M560 180 H690"/>
<rect x="340" y="168" width="80" height="24" fill="white" stroke="#14213d" stroke-width="3"/>
<text x="340" y="150" class="label">R1: 330 Ω</text>
<path d="M520 161 L560 180 L520 199 Z" fill="#ffebee" stroke="#14213d" stroke-width="3"/>
<path class="wire" d="M560 158 V202 M550 151 l19 -19 m-10 0 h10 v10 M567 160 l19 -19 m-10 0 h10 v10"/>
<text x="725" y="174" class="label">LED 1: red</text>
<text x="725" y="200" class="small">≈9.1 mA when ON</text>
<text x="496" y="224" class="small">A (+)</text><text x="562" y="224" class="small">K (−)</text>
<circle cx="690" cy="180" r="5" fill="#14213d"/>
<text x="217" y="288" class="label">D6</text>
<path class="wire" d="M270 300 H340 m80 0 H520 M560 300 H690"/>
<rect x="340" y="288" width="80" height="24" fill="white" stroke="#14213d" stroke-width="3"/>
<text x="340" y="270" class="label">R2: 330 Ω</text>
<path d="M520 281 L560 300 L520 319 Z" fill="#e8f5e9" stroke="#14213d" stroke-width="3"/>
<path class="wire" d="M560 278 V322 M550 271 l19 -19 m-10 0 h10 v10 M567 280 l19 -19 m-10 0 h10 v10"/>
<text x="725" y="294" class="label">LED 2: green</text>
<text x="725" y="320" class="small">≈8.5 mA when ON</text>
<text x="496" y="344" class="small">A (+)</text><text x="562" y="344" class="small">K (−)</text>
<circle cx="690" cy="300" r="5" fill="#14213d"/>
<text x="217" y="408" class="label">D5</text>
<path class="wire" d="M270 420 H340 m80 0 H520 M560 420 H690"/>
<rect x="340" y="408" width="80" height="24" fill="white" stroke="#14213d" stroke-width="3"/>
<text x="340" y="390" class="label">R3: 330 Ω</text>
<path d="M520 401 L560 420 L520 439 Z" fill="#e3f2fd" stroke="#14213d" stroke-width="3"/>
<path class="wire" d="M560 398 V442 M550 391 l19 -19 m-10 0 h10 v10 M567 400 l19 -19 m-10 0 h10 v10"/>
<text x="725" y="414" class="label">LED 3: blue</text>
<text x="725" y="440" class="small">≈5.5 mA when ON</text>
<text x="496" y="464" class="small">A (+)</text><text x="562" y="464" class="small">K (−)</text>
<circle cx="690" cy="420" r="5" fill="#14213d"/>
<path class="wire" d="M690 180 V575 M270 510 H690 M672 575 H708 M679 583 H701 M686 591 H694"/>
<text x="213" y="498" class="label">GND</text>
<text x="725" y="517" class="label">Shared ground</text>
<text x="50" y="602" class="small">LED long leg (anode) → resistor. Short leg / flat side (cathode) → GND.</text>
<text x="50" y="628" class="small">Estimated forward drops: red 2.0 V, green 2.2 V, blue 3.2 V. Actual LEDs may differ.</text>
</svg>
